name: "Terraform Infrastructure Checks & Deployment"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily drift detection run

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_IN_AUTOMATION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Validate
        if: github.event_name != 'schedule'
        run: terraform validate -no-color

      - name: Terraform Plan
        if: github.event_name != 'schedule'
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Check for infrastructure drift
        if: github.event_name == 'schedule'
        id: drift
        shell: bash
        run: |
          set +e
          terraform plan -refresh-only -input=false -detailed-exitcode -no-color
          plan_exit_code=$?
          set -e

          case "$plan_exit_code" in
            0)
              echo "No infrastructure drift detected."
              ;;
            2)
              echo "::error::Infrastructure drift detected; no changes were applied."
              exit 1
              ;;
            *)
              echo "::error::Terraform drift check failed with exit code $plan_exit_code."
              exit "$plan_exit_code"
              ;;
          esac

      - name: Upload Plan Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          if-no-files-found: error
          retention-days: 1

      - name: Comment plan on pull request
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ github.token }}
          script: |
            const outcome = process.env.PLAN_OUTCOME || "not run";
            const plan = process.env.PLAN_OUTPUT || "Terraform plan did not produce output.";
            const maxLength = 50000;
            const output = plan.length > maxLength
              ? `${plan.slice(0, maxLength)}\n\n[Plan output truncated.]`
              : plan;
            const safeOutput = output.replace(/```/g, "`\u200b``");
            const body = [
              `#### Terraform Plan Status: \`${outcome}\``,
              "<details><summary>Show Plan Output</summary>",
              "",
              "```terraform",
              safeOutput,
              "```",
              "",
              "</details>"
            ].join("\n");

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Terraform ${{ github.event_name == 'schedule' && 'drift check' || 'plan and validation' }} for ${{ github.repository }} completed with status: ${{ job.status }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: vprofile-infra
    env:
      TF_IN_AUTOMATION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Apply
        run: terraform apply -input=false -no-color tfplan

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Terraform apply for ${{ github.repository }} completed with status: ${{ job.status }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
