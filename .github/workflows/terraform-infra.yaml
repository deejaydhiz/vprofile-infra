name: "Terraform Infrastructure Checks & Deployment"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Update your triggers at the top of the file to include manual execution
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 20 * * *' # Daily drift detection run (Keep in mind this is UTC!)
  workflow_dispatch: {}  # 👈 ADDS A MANUAL "RUN WORKFLOW" BUTTON TO UI TO VERIFY IMMEDIATELY

permissions:
  id-token: write      
  contents: read       
  pull-requests: write 

jobs:
  terraform-plan:
    name: "Terraform Validate & Plan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        if: github.event_name != 'schedule'
        run: terraform validate

      - name: Terraform Plan (Standard)
        if: github.event_name != 'schedule'
        id: plan
        run: terraform plan -no-color -out=tfplan

      # # DRIFT DETECTION STEP (Runs only on schedule)
      # - name: Terraform Plan (Drift Check)
      #   if: github.event_name == 'schedule'
      #   id: drift
      #   run: |
      #     terraform plan -detailed-exitcode -no-color || exit_code=$?
      #     if [ ${exit_code} -eq 0 ]; then
      #       echo "No drift detected."
      #       exit 0
      #     elif [ ${exit_code} -eq 2 ]; then
      #       echo "::error::DRIFT DETECTED!"
      #       exit 1
      #     else
      #       echo "::error::Terraform system error."
      #       exit ${exit_code}
      #     fi

      # DRIFT DETECTION STEP (Fixed bash logic to catch the exit code safely)
      - name: Terraform Plan (Drift Check)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: drift
        run: |
          # Disable default 'fail immediately on non-zero exit codes'
          set +e 
          
          terraform plan -detailed-exitcode -no-color
          exit_code=$?
          
          # Re-enable standard error handling
          set -e 
          
          if [ ${exit_code} -eq 0 ]; then
            echo "No drift detected."
            exit 0
          elif [ ${exit_code} -eq 2 ]; then
            echo "::error::DRIFT DETECTED!"
            exit 1
          else
            echo "::error::Terraform system error encountered."
            exit ${exit_code}
          fi

      - name: Upload Plan Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan Status: \`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan Output</summary>
            
            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # DYNAMIC SLACK NOTIFICATION FOR PLAN / DRIFT
      - name: Notify Slack (Plan or Drift)
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && '#2eb886' || '#a30200' }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ github.event_name == 'schedule' && '⏰ *Daily Drift Check*' || '🔨 *Terraform Plan & Validate Check*' }} completed with status: *${{ job.status }}*\n👉 *Triggered by:* @${{ github.actor }}\n👉 *Event:* `${{ github.event_name }}`"
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Action Log"
                          },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }

  terraform-apply:
    name: "Terraform Apply"
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: vprofile-infra # Forces the manual "Review deployments" UI button click
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      # DYNAMIC SLACK NOTIFICATION FOR APPLY
      - name: Notify Slack (Apply)
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && '#2eb886' || '#a30200' }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "🚀 *Terraform Apply Deployment* finished with status: *${{ job.status }}*\n👉 *Approved & Triggered by:* @${{ github.actor }}"
                      }
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Deployment Logs"
                          },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
